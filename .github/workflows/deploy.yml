name: Deploy backend to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Passenger bundle
        run: npm run build:passenger

      - name: Assemble deploy package
        run: |
          mkdir -p deploy/dist deploy/tmp
          cp app.js deploy/app.js
          cp dist/passenger.js deploy/dist/passenger.js
          cp -r public deploy/public
          # Changing content forces re-upload → Passenger sees a newer
          # tmp/restart.txt and restarts the app after deploy.
          date -u +"%Y-%m-%dT%H:%M:%SZ ${{ github.sha }}" > deploy/tmp/restart.txt

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          # cPanel Node.js "Application root" path, e.g. /home/USER/olljira-api/
          server-dir: ${{ vars.APP_SERVER_DIR }}
          dangerous-clean-slate: false
